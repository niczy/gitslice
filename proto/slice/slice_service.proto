syntax = "proto3";

package slice.v1;

option go_package = "github.com/niczy/gitslice/proto;slicev1";

import "common/visibility.proto";
import "google/api/annotations.proto";
import "file/file_service.proto";

service SliceService {
  // Checkout slice for editing
  rpc CheckoutSlice(CheckoutRequest) returns (CheckoutResponse);

  // Create a new change list
  rpc CreateChangeset(CreateChangesetRequest) returns (CreateChangesetResponse);

  // Review a change list (check against slice head)
  rpc ReviewChangeset(ReviewChangesetRequest) returns (ReviewChangesetResponse) {
    option (google.api.http) = {
      get: "/v1/changesets/{changeset_id}/diff"
    };
  }

  // List version snapshots for a changeset.
  rpc ListChangesetSnapshots(ListChangesetSnapshotsRequest) returns (ListChangesetSnapshotsResponse) {
    option (google.api.http) = {
      get: "/v1/changesets/{changeset_id}/snapshots"
    };
  }

  // Merge change list into slice (with conflict detection)
  rpc MergeChangeset(MergeChangesetRequest) returns (MergeChangesetResponse) {
    option (google.api.http) = {
      post: "/v1/changesets/{changeset_id}/merge"
      body: "*"
    };
  }

  // Close a pending/approved changeset without merging.
  rpc CloseChangeset(CloseChangesetRequest) returns (CloseChangesetResponse) {
    option (google.api.http) = {
      post: "/v1/changesets/{changeset_id}/close"
      body: "*"
    };
  }

  // Create a revert changeset. When change_id is empty, reverts the full commit diff.
  rpc RevertCommitChange(RevertCommitChangeRequest) returns (CreateChangesetResponse) {
    option (google.api.http) = {
      post: "/v1/commits/{commit_hash}/changes/revert"
      body: "*"
    };
  }

  // Rebase change list on new slice head
  rpc RebaseChangeset(RebaseChangesetRequest) returns (RebaseChangesetResponse);

  // Get slice commit history
  rpc GetSliceCommits(CommitHistoryRequest) returns (CommitHistoryResponse);

  // Get current slice state
  rpc GetSliceState(StateRequest) returns (StateResponse);

  // List pending change lists for a slice
  rpc ListChangesets(ListChangesetsRequest) returns (ListChangesetsResponse);

  // Get root slice info
  rpc GetRootSlice(GetRootSliceRequest) returns (GetRootSliceResponse);

  // Create a new slice from an existing folder
  rpc CreateSliceFromFolder(CreateSliceFromFolderRequest) returns (CreateSliceFromFolderResponse);

  // Rename a slice (update display name)
  rpc RenameSlice(RenameSliceRequest) returns (RenameSliceResponse);

  // Delete a custom slice.
  rpc DeleteSlice(DeleteSliceRequest) returns (DeleteSliceResponse) {
    option (google.api.http) = {
      delete: "/v1/slices/{slice_id}"
    };
  }

  // Get slice info by display name
  rpc GetSliceByName(GetSliceByNameRequest) returns (GetSliceByNameResponse);

  // Get slice info by stable slug.
  rpc GetSliceBySlug(GetSliceBySlugRequest) returns (GetSliceBySlugResponse) {
    option (google.api.http) = {
      get: "/v1/slices/by-slug"
    };
  }

  // Inspect the configured visibility of a slice.
  rpc GetSliceVisibility(GetSliceVisibilityRequest) returns (GetSliceVisibilityResponse) {
    option (google.api.http) = {
      get: "/v1/slices/{slice_id}/visibility"
    };
  }

  // Update the configured visibility of a slice.
  rpc SetSliceVisibility(SetSliceVisibilityRequest) returns (SetSliceVisibilityResponse) {
    option (google.api.http) = {
      post: "/v1/slices/{slice_id}:setVisibility"
      body: "*"
    };
  }

  // Fetch the immutable regex-search artifact for a slice commit.
  rpc GetSliceSearchArtifact(GetSliceSearchArtifactRequest) returns (GetSliceSearchArtifactResponse) {
    option (google.api.http) = {
      get: "/v1/slices/{slice_id}/search-artifact"
    };
  }

  // Stream checkout for large slices (server streaming)
  rpc StreamCheckoutSlice(CheckoutRequest) returns (stream CheckoutChunk);

  // Stream changeset creation (client streaming)
  rpc StreamCreateChangeset(stream ChangesetChunk) returns (CreateChangesetResponse);
}

message CheckoutRequest {
  string slice_id = 1;
  string commit_hash = 2;
  repeated string known_hashes = 3;
}

message CheckoutResponse {
  SliceManifest manifest = 1;
  repeated FileContent files = 2;
  repeated BlockContent blocks = 3;
}

message SliceManifest {
  string commit_hash = 1;
  repeated FileMetadata file_metadata = 2;
}

message FileMetadata {
  string file_id = 1;
  string path = 2;
  int64 size = 3;
  string hash = 4;
  string content_url = 5;
  repeated FileBlockRef blocks = 6;
  bool executable = 7;
  string symlink_target = 8;
}

message FileContent {
  string file_id = 1;
  bytes content = 2;
}

message FileBlockRef {
  string hash = 1;
  int64 size = 2;
}

message BlockContent {
  string hash = 1;
  bytes content = 2;
}

message CheckoutChunk {
  oneof chunk {
    SliceManifest manifest = 1;
    FileContent file = 2;
    BlockContent block = 3;
  }
}

message GetSliceSearchArtifactRequest {
  string slice_id = 1;
  string commit_hash = 2;
  uint32 version = 3;
}

message GetSliceSearchArtifactResponse {
  string slice_id = 1;
  string commit_hash = 2;
  uint32 version = 3;
  bytes artifact = 4;
}

message CreateChangesetRequest {
  string slice_id = 1;
  string base_commit_hash = 2;
  repeated Object objects = 3;
  repeated string modified_files = 4;
  string author = 5;
  string message = 6;
  string changeset_id = 7; // Optional: append a new snapshot to this changeset.
}

message CreateChangesetResponse {
  string changeset_id = 1;
  string changeset_hash = 2;
  ChangesetStatus status = 3;
}

message ChangesetChunk {
  oneof chunk {
    ChangesetMetadata metadata = 1;
    Object object = 2;
  }
}

message ChangesetMetadata {
  string slice_id = 1;
  string base_commit_hash = 2;
  string author = 3;
  string message = 4;
}

message Object {
  ObjectType type = 1;
  string hash = 2;
  bytes data = 3;
}

enum ObjectType {
  BLOB = 0;
  TREE = 1;
  COMMIT = 2;
  SLICE_DEF = 3;
  CHANGESET = 4;
}

message ReviewChangesetRequest {
  string changeset_id = 1;
  int32 snapshot_version = 2; // Optional: review a specific snapshot version.
}

message ReviewChangesetResponse {
  ChangesetInfo changeset = 1;
  DiffSummary diff = 2;
  ReviewStatus review_status = 3;
  repeated string warnings = 4;
  repeated file.v1.FileChangeRecord changes = 5;
  ChangesetSnapshotInfo snapshot = 6;
  repeated ReviewIssue issues = 7;
}

message ListChangesetSnapshotsRequest {
  string changeset_id = 1;
  int32 limit = 2;
}

message ListChangesetSnapshotsResponse {
  repeated ChangesetSnapshotInfo snapshots = 1;
}

message ChangesetSnapshotInfo {
  string snapshot_id = 1;
  string changeset_id = 2;
  int32 version = 3;
  string hash = 4;
  string base_commit_hash = 5;
  repeated string modified_files = 6;
  string author = 7;
  string message = 8;
  int64 created_at = 9;
}

message DiffSummary {
  int32 files_added = 1;
  int32 files_modified = 2;
  int32 files_deleted = 3;
  int64 lines_added = 4;
  int64 lines_removed = 5;
}

message MergeChangesetRequest {
  string changeset_id = 1;
}

message MergeChangesetResponse {
  MergeStatus status = 1;
  string new_commit_hash = 2;
  string changeset_id = 3;
  repeated Conflict conflicts = 4;
  string message = 5;
}

enum MergeStatus {
  MERGE_STATUS_SUCCESS = 0;
  MERGE_STATUS_CONFLICT = 1;
  MERGE_STATUS_ERROR = 2;
  MERGE_STATUS_LOCKED = 3;
  MERGE_STATUS_STALE_BASE = 4;
}

message Conflict {
  string file_id = 1;
  repeated string conflicting_slice_ids = 2;
  ConflictType type = 3;
  string message = 4;
}

enum ConflictType {
  CONFLICT_TYPE_UNSPECIFIED = 0;
  CONFLICT_TYPE_CONTENT = 1;
  CONFLICT_TYPE_OWNERSHIP = 2;
}

message RebaseChangesetRequest {
  string changeset_id = 1;
}

message RebaseChangesetResponse {
  RebaseStatus status = 1;
  string new_base_commit_hash = 2;
  repeated string slice_commits_to_apply = 3;
  repeated Conflict conflicts = 4;
}

message CloseChangesetRequest {
  string changeset_id = 1;
}

message CloseChangesetResponse {
  string changeset_id = 1;
  ChangesetStatus status = 2;
}

message RevertCommitChangeRequest {
  string commit_hash = 1;
  string change_id = 2;  // Optional: revert only one change when provided.
  string slice_id = 3;
  string message = 4;
}

enum RebaseStatus {
  REBASE_STATUS_SUCCESS = 0;
  REBASE_STATUS_CONFLICT = 1;
  REBASE_STATUS_NEEDS_MERGE = 2;
  REBASE_STATUS_ERROR = 3;
}

message ListChangesetsRequest {
  string slice_id = 1;
  ChangesetStatus status_filter = 2;
  int32 limit = 3;
}

message ListChangesetsResponse {
  repeated ChangesetInfo changesets = 1;
}

message ChangesetInfo {
  string changeset_id = 1;
  string changeset_hash = 2;
  string slice_id = 3;
  string base_commit_hash = 4;
  repeated string modified_files = 5;
  ChangesetStatus status = 6;
  string author = 7;
  int64 created_at = 8;
  int64 merged_at = 9;
  string message = 10;
}

enum ChangesetStatus {
  PENDING = 0;
  APPROVED = 1;
  REJECTED = 2;
  MERGED = 3;
}

enum ReviewStatus {
  READY_FOR_MERGE = 0;
  NEEDS_REBASE = 1;
  HAS_CONFLICTS = 2;
}

enum ReviewIssueType {
  REVIEW_ISSUE_TYPE_UNSPECIFIED = 0;
  REVIEW_ISSUE_TYPE_STALE_BASE = 1;
  REVIEW_ISSUE_TYPE_CONTENT_CONFLICT = 2;
  REVIEW_ISSUE_TYPE_OWNERSHIP_CONFLICT = 3;
}

message ReviewIssue {
  ReviewIssueType type = 1;
  string file_id = 2;
  repeated string conflicting_slice_ids = 3;
  string message = 4;
}

message CommitHistoryRequest {
  string slice_id = 1;
  int64 limit = 2;
  string from_commit_hash = 3;
}

message CommitHistoryResponse {
  repeated CommitInfo commits = 1;
}

message CommitInfo {
  string commit_hash = 1;
  int64 timestamp = 2;
  string parent_hash = 3;
  string message = 4;
}

message StateRequest {
  string slice_id = 1;
}

message StateResponse {
  string latest_commit_hash = 1;
  repeated string modified_files = 2;
  int64 last_modified = 3;
}

// Request to get root slice info
message GetRootSliceRequest {}

// Response with root slice info
message GetRootSliceResponse {
  string slice_id = 1;
  string commit_hash = 2;
  common.v1.Visibility visibility = 3;
}

// Request to create a slice from an existing folder
message CreateSliceFromFolderRequest {
  string parent_slice_id = 1;
  string folder_path = 2;
  string new_slice_id = 3;
  string name = 4;
  string description = 5;
  repeated string folder_paths = 6;
}

// Response for slice creation from folder
message CreateSliceFromFolderResponse {
  string slice_id = 1;
  string status = 2;
  repeated string files = 3;
  string name = 4;
  string slug = 5;
  common.v1.Visibility visibility = 6;
}

// Request to rename a slice
message RenameSliceRequest {
  string slice_id = 1;
  string new_name = 2;
}

// Response for slice rename
message RenameSliceResponse {
  string slice_id = 1;
  string name = 2;
  string slug = 3;
}

// Request to delete a custom slice.
message DeleteSliceRequest {
  string slice_id = 1;
  bool force = 2;
}

// Response for slice deletion.
message DeleteSliceResponse {
  string slice_id = 1;
  string slug = 2;
  string status = 3;
}

// Request to get a slice by display name
message GetSliceByNameRequest {
  string name = 1;
}

// Response with slice info looked up by name
message GetSliceByNameResponse {
  string slice_id = 1;
  string name = 2;
  string description = 3;
  string parent_slice_id = 4;
  repeated string files = 5;
  string environment = 6;
  string slug = 7;
  common.v1.Visibility visibility = 8;
}

message GetSliceBySlugRequest {
  string slug = 1;
}

message GetSliceBySlugResponse {
  string slice_id = 1;
  string name = 2;
  string description = 3;
  string parent_slice_id = 4;
  repeated string files = 5;
  string environment = 6;
  string slug = 7;
  common.v1.Visibility visibility = 8;
}

message GetSliceVisibilityRequest {
  string slice_id = 1;
}

message GetSliceVisibilityResponse {
  string slice_id = 1;
  common.v1.Visibility visibility = 2;
}

message SetSliceVisibilityRequest {
  string slice_id = 1;
  common.v1.Visibility visibility = 2;
  common.v1.PathVisibilityPropagationMode path_propagation_mode = 3;
}

message SetSliceVisibilityResponse {
  string slice_id = 1;
  common.v1.Visibility visibility = 2;
  common.v1.PathVisibilityPropagationMode path_propagation_mode = 3;
}
