syntax = "proto3";

package slice.v1;

option go_package = "github.com/niczy/gitslice/proto;slicev1";

import "common/visibility.proto";
import "google/api/annotations.proto";
import "file/file_service.proto";

service SliceService {
  // Checkout slice for editing
  rpc CheckoutSlice(CheckoutRequest) returns (CheckoutResponse);

  // Create a new change list
  rpc CreateChangeset(CreateChangesetRequest) returns (CreateChangesetResponse) {
    option (google.api.http) = {
      post: "/v1/changesets"
      body: "*"
    };
  }

  // Create and immediately commit a direct file-tree edit.
  rpc CreateAndMergeChangeset(CreateChangesetRequest) returns (MergeChangesetResponse) {
    option (google.api.http) = {
      post: "/v1/changesets:createAndMerge"
      body: "*"
    };
  }

  // Review a change list (check against slice head)
  rpc ReviewChangeset(ReviewChangesetRequest) returns (ReviewChangesetResponse) {
    option (google.api.http) = {
      get: "/v1/changesets/{changeset_id}/diff"
    };
  }

  // Get server-side links between a changeset, agent conversations, and merge commits.
  rpc GetChangesetArtifactLinks(GetChangesetArtifactLinksRequest) returns (GetChangesetArtifactLinksResponse) {
    option (google.api.http) = {
      get: "/v1/changesets/{changeset_id}/artifact-links"
    };
  }

  // Get server-side links between a commit, its originating changeset, and agent conversations.
  rpc GetCommitArtifactLinks(GetCommitArtifactLinksRequest) returns (GetCommitArtifactLinksResponse) {
    option (google.api.http) = {
      get: "/v1/commits/{commit_hash}/artifact-links"
    };
  }

  // List version snapshots for a changeset.
  rpc ListChangesetSnapshots(ListChangesetSnapshotsRequest) returns (ListChangesetSnapshotsResponse) {
    option (google.api.http) = {
      get: "/v1/changesets/{changeset_id}/snapshots"
    };
  }

  // Stream file metadata and missing content for one changeset snapshot.
  rpc StreamChangesetSnapshot(ChangesetSnapshotRequest) returns (stream ChangesetSnapshotChunk) {
    option (google.api.http) = {
      get: "/v1/changesets/{changeset_id}/snapshot-content"
    };
  }

  // Merge change list into slice (with conflict detection)
  rpc MergeChangeset(MergeChangesetRequest) returns (MergeChangesetResponse) {
    option (google.api.http) = {
      post: "/v1/changesets/{changeset_id}/merge"
      body: "*"
    };
  }

  // List durable merge conflicts for one changeset.
  rpc ListChangesetConflicts(ListChangesetConflictsRequest) returns (ListChangesetConflictsResponse) {
    option (google.api.http) = {
      get: "/v1/changesets/{changeset_id}/conflicts"
    };
  }

  // Inspect or wait for a projection to catch up to a merge sequence.
  rpc GetProjectionStatus(GetProjectionStatusRequest) returns (ProjectionStatus) {
    option (google.api.http) = {
      get: "/v1/projections/{projection_name}/status"
    };
  }

  // Close a pending/approved changeset without merging.
  rpc CloseChangeset(CloseChangesetRequest) returns (CloseChangesetResponse) {
    option (google.api.http) = {
      post: "/v1/changesets/{changeset_id}/close"
      body: "*"
    };
  }

  // Create a revert changeset. When change_id is empty, reverts the full commit diff.
  rpc RevertCommitChange(RevertCommitChangeRequest) returns (CreateChangesetResponse) {
    option (google.api.http) = {
      post: "/v1/commits/{commit_hash}/changes/revert"
      body: "*"
    };
  }

  // Rebase change list on new slice head
  rpc RebaseChangeset(RebaseChangesetRequest) returns (RebaseChangesetResponse);

  // Get slice commit history
  rpc GetSliceCommits(CommitHistoryRequest) returns (CommitHistoryResponse) {
    option (google.api.http) = {
      get: "/v1/slices/{slice_id}/commits"
    };
  }

  // Get current slice state
  rpc GetSliceState(StateRequest) returns (StateResponse);

  // List pending change lists for a slice
  rpc ListChangesets(ListChangesetsRequest) returns (ListChangesetsResponse) {
    option (google.api.http) = {
      get: "/v1/slices/{slice_id}/changesets"
    };
  }

  // Get root slice info
  rpc GetRootSlice(GetRootSliceRequest) returns (GetRootSliceResponse);

  // List slices visible to the current caller.
  rpc ListSlices(ListSlicesRequest) returns (ListSlicesResponse) {
    option (google.api.http) = {
      get: "/v1/slices"
    };
  }

  // Get global state.
  rpc GetGlobalState(GlobalStateRequest) returns (GlobalStateResponse) {
    option (google.api.http) = {
      get: "/v1/global/state"
    };
  }

  // Trigger batch merge to global for the current caller's slices.
  rpc BatchMerge(BatchMergeRequest) returns (BatchMergeResponse) {
    option (google.api.http) = {
      post: "/v1/global/batch-merge"
      body: "*"
    };
  }

  // Get conflicts scoped to the current caller's accessible slices.
  rpc GetConflicts(ConflictsRequest) returns (ConflictsResponse) {
    option (google.api.http) = {
      get: "/v1/conflicts"
    };
  }

  // Resolve a conflict scoped to the current caller's manageable slices.
  rpc ResolveConflict(ResolveConflictRequest) returns (ResolveConflictResponse) {
    option (google.api.http) = {
      post: "/v1/conflicts:resolve"
      body: "*"
    };
  }

  // Import a remote git repository into the current caller's home tree.
  rpc ImportGitRepo(ImportGitRepoRequest) returns (ImportGitRepoResponse) {
    option (google.api.http) = {
      post: "/v1/import/git"
      body: "*"
    };
  }

  // Create a new slice from an existing folder
  rpc CreateSliceFromFolder(CreateSliceFromFolderRequest) returns (CreateSliceFromFolderResponse) {
    option (google.api.http) = {
      post: "/v1/slices:createFromFolder"
      body: "*"
    };
  }

  // Rename a slice (update display name)
  rpc RenameSlice(RenameSliceRequest) returns (RenameSliceResponse);

  // Delete a custom slice.
  rpc DeleteSlice(DeleteSliceRequest) returns (DeleteSliceResponse) {
    option (google.api.http) = {
      delete: "/v1/slices/{slice_id}"
    };
  }

  // Get slice info by display name
  rpc GetSliceByName(GetSliceByNameRequest) returns (GetSliceByNameResponse);

  // Get slice info by stable slug.
  rpc GetSliceBySlug(GetSliceBySlugRequest) returns (GetSliceBySlugResponse) {
    option (google.api.http) = {
      get: "/v1/slices/by-slug"
    };
  }

  // Resolve slice info by canonical slice ID, qualified slug, or caller-local slug.
  rpc ResolveSlice(ResolveSliceRequest) returns (ResolveSliceResponse) {
    option (google.api.http) = {
      get: "/v1/slices:resolve"
    };
  }

  // Inspect the configured visibility of a slice.
  rpc GetSliceVisibility(GetSliceVisibilityRequest) returns (GetSliceVisibilityResponse) {
    option (google.api.http) = {
      get: "/v1/slices/{slice_id}/visibility"
    };
  }

  // Update the configured visibility of a slice.
  rpc SetSliceVisibility(SetSliceVisibilityRequest) returns (SetSliceVisibilityResponse) {
    option (google.api.http) = {
      post: "/v1/slices/{slice_id}:setVisibility"
      body: "*"
    };
  }

  // Fetch the immutable regex-search artifact for a slice commit.
  rpc GetSliceSearchArtifact(GetSliceSearchArtifactRequest) returns (GetSliceSearchArtifactResponse) {
    option (google.api.http) = {
      get: "/v1/slices/{slice_id}/search-artifact"
    };
  }

  // Add a tracked folder to a custom slice.
  rpc AddSliceFolder(AddSliceFolderRequest) returns (AddSliceFolderResponse) {
    option (google.api.http) = {
      post: "/v1/slices/{slice_id}/folders:add"
      body: "*"
    };
  }

  // Remove a tracked folder from a custom slice.
  rpc RemoveSliceFolder(RemoveSliceFolderRequest) returns (RemoveSliceFolderResponse) {
    option (google.api.http) = {
      post: "/v1/slices/{slice_id}/folders:remove"
      body: "*"
    };
  }

  // Read the tracked environment materialization requirements for a slice.
  rpc GetSliceEnvRequirements(GetSliceEnvRequirementsRequest) returns (GetSliceEnvRequirementsResponse) {
    option (google.api.http) = {
      get: "/v1/slices/{slice_id}/env/requirements"
    };
  }

  // List server-side environment key/value metadata for a slice profile.
  rpc ListSliceEnvKV(ListSliceEnvKVRequest) returns (ListSliceEnvKVResponse) {
    option (google.api.http) = {
      get: "/v1/slices/{slice_id}/env/kv"
    };
  }

  // Set a readable non-secret environment value.
  rpc SetSliceEnvValue(SetSliceEnvValueRequest) returns (SetSliceEnvValueResponse) {
    option (google.api.http) = {
      post: "/v1/slices/{slice_id}/env/kv/values/{key}"
      body: "*"
    };
  }

  // Set a write-only secret environment value.
  rpc SetSliceEnvSecret(SetSliceEnvSecretRequest) returns (SetSliceEnvSecretResponse) {
    option (google.api.http) = {
      post: "/v1/slices/{slice_id}/env/kv/secrets/{key}"
      body: "*"
    };
  }

  // Delete one environment KV entry.
  rpc DeleteSliceEnvKV(DeleteSliceEnvKVRequest) returns (DeleteSliceEnvKVResponse) {
    option (google.api.http) = {
      delete: "/v1/slices/{slice_id}/env/kv/{class}/{key}"
    };
  }

  // Render declared materialized files using server-side KV values.
  rpc RenderSliceEnvMaterialization(RenderSliceEnvMaterializationRequest) returns (RenderSliceEnvMaterializationResponse) {
    option (google.api.http) = {
      post: "/v1/slices/{slice_id}/env:materialize"
      body: "*"
    };
  }

  // Stream checkout for large slices (server streaming)
  rpc StreamCheckoutSlice(CheckoutRequest) returns (stream CheckoutChunk);

  // Stream changeset creation (client streaming)
  rpc StreamCreateChangeset(stream ChangesetChunk) returns (CreateChangesetResponse);

  // Stream scoped conflict updates.
  rpc WatchConflicts(WatchConflictsRequest) returns (stream ConflictUpdate);
}

message CheckoutRequest {
  string slice_id = 1;
  string commit_hash = 2;
  repeated string known_hashes = 3;
}

message CheckoutResponse {
  SliceManifest manifest = 1;
  repeated FileContent files = 2;
  repeated BlockContent blocks = 3;
}

message SliceManifest {
  string commit_hash = 1;
  repeated FileMetadata file_metadata = 2;
}

message FileMetadata {
  string file_id = 1;
  string path = 2;
  int64 size = 3;
  string hash = 4;
  string content_url = 5;
  repeated FileBlockRef blocks = 6;
  bool executable = 7;
  string symlink_target = 8;
}

message FileContent {
  string file_id = 1;
  bytes content = 2;
}

message FileBlockRef {
  string hash = 1;
  int64 size = 2;
}

message BlockContent {
  string hash = 1;
  bytes content = 2;
}

message CheckoutChunk {
  oneof chunk {
    SliceManifest manifest = 1;
    FileContent file = 2;
    BlockContent block = 3;
  }
}

message GetSliceSearchArtifactRequest {
  string slice_id = 1;
  string commit_hash = 2;
  uint32 version = 3;
}

message GetSliceSearchArtifactResponse {
  string slice_id = 1;
  string commit_hash = 2;
  uint32 version = 3;
  bytes artifact = 4;
}

message CreateChangesetRequest {
  string slice_id = 1;
  string base_commit_hash = 2;
  repeated Object objects = 3;
  repeated string modified_files = 4;
  string author = 5;
  string message = 6;
  string changeset_id = 7; // Optional: append a new snapshot to this changeset.
  repeated FileContentChange file_contents = 8; // Optional: file payloads for local checkout changes.
  repeated file.v1.PathBase expected_path_bases = 9; // Optional: reject writes if these read-time bases are stale.
  repeated FileRename file_renames = 10; // Optional: first-class file rename intents.
  repeated DirectoryRename directory_renames = 11; // Optional: first-class directory rename intents.
}

message CreateChangesetResponse {
  string changeset_id = 1;
  string changeset_hash = 2;
  ChangesetStatus status = 3;
  string ci_run_id = 4;
  string ci_status = 5;
}

message FileContentChange {
  string path = 1;
  bytes content = 2;
  bool deleted = 3;
  bool executable = 4;
  string symlink_target = 5;
}

message FileRename {
  string source_path = 1;
  string destination_path = 2;
}

message DirectoryRename {
  string source_path = 1;
  string destination_path = 2;
}

message ChangesetChunk {
  oneof chunk {
    ChangesetMetadata metadata = 1;
    Object object = 2;
  }
}

message ChangesetMetadata {
  string slice_id = 1;
  string base_commit_hash = 2;
  string author = 3;
  string message = 4;
}

message Object {
  ObjectType type = 1;
  string hash = 2;
  bytes data = 3;
}

enum ObjectType {
  BLOB = 0;
  TREE = 1;
  COMMIT = 2;
  SLICE_DEF = 3;
  CHANGESET = 4;
}

message ReviewChangesetRequest {
  string changeset_id = 1;
  int32 snapshot_version = 2; // Optional: review a specific snapshot version.
}

message ReviewChangesetResponse {
  ChangesetInfo changeset = 1;
  DiffSummary diff = 2;
  ReviewStatus review_status = 3;
  repeated string warnings = 4;
  repeated file.v1.FileChangeRecord changes = 5;
  ChangesetSnapshotInfo snapshot = 6;
  repeated ReviewIssue issues = 7;
}

message GetChangesetArtifactLinksRequest {
  string changeset_id = 1;
}

message GetChangesetArtifactLinksResponse {
  ChangesetInfo changeset = 1;
  repeated AgentSessionChangesetLink agent_sessions = 2;
  ChangesetMergeLink merge = 3;
}

message GetCommitArtifactLinksRequest {
  string commit_hash = 1;
}

message GetCommitArtifactLinksResponse {
  string commit_hash = 1;
  ChangesetInfo changeset = 2;
  repeated AgentSessionChangesetLink agent_sessions = 3;
}

message AgentSessionChangesetLink {
  string session_id = 1;
  string changeset_id = 2;
  string snapshot_id = 3;
  int32 snapshot_version = 4;
  string snapshot_hash = 5;
  string base_commit_hash = 6;
  uint64 exported_from_seq = 7;
  string runner_id = 8;
  string source = 9;
  int64 exported_at = 10;
  string slice_id = 11;
}

message ChangesetMergeLink {
  string commit_hash = 1;
  string source_slice_id = 2;
  int64 merged_at = 3;
}

message ListChangesetSnapshotsRequest {
  string changeset_id = 1;
  int32 limit = 2;
  bool omit_modified_files = 3;
}

message ListChangesetSnapshotsResponse {
  repeated ChangesetSnapshotInfo snapshots = 1;
}

message ChangesetSnapshotRequest {
  string changeset_id = 1;
  int32 snapshot_version = 2;
  string snapshot_hash = 3;
  repeated string paths = 4;
  repeated string known_hashes = 5;
  bool metadata_only = 6;
}

message ChangesetSnapshotManifest {
  ChangesetSnapshotInfo snapshot = 1;
  repeated FileMetadata file_metadata = 2;
  repeated string deleted_paths = 3;
  string slice_id = 4;
}

message ChangesetSnapshotChunk {
  oneof chunk {
    ChangesetSnapshotManifest manifest = 1;
    FileContent file = 2;
    BlockContent block = 3;
  }
}

message ChangesetSnapshotInfo {
  string snapshot_id = 1;
  string changeset_id = 2;
  int32 version = 3;
  string hash = 4;
  string base_commit_hash = 5;
  repeated string modified_files = 6;
  string author = 7;
  string message = 8;
  int64 created_at = 9;
  int32 modified_file_count = 10;
}

message DiffSummary {
  int32 files_added = 1;
  int32 files_modified = 2;
  int32 files_deleted = 3;
  int64 lines_added = 4;
  int64 lines_removed = 5;
}

message MergeChangesetRequest {
  string changeset_id = 1;
  bool force = 2;
  string force_reason = 3;
}

message MergeChangesetResponse {
  MergeStatus status = 1;
  string new_commit_hash = 2;
  string changeset_id = 3;
  repeated Conflict conflicts = 4;
  string message = 5;
  string merge_home_id = 6;
  int32 merge_shard = 7;
  int64 merge_seq = 8;
  repeated ProjectionStatus projections = 9;
}

message GetProjectionStatusRequest {
  string projection_name = 1;
  int32 shard_id = 2;
  int64 merge_seq = 3;
  int32 wait_ms = 4;
}

message ProjectionStatus {
  string projection_name = 1;
  int32 shard_id = 2;
  int64 requested_seq = 3;
  int64 applied_seq = 4;
  ProjectionState state = 5;
}

enum ProjectionState {
  PROJECTION_STATE_UNSPECIFIED = 0;
  PROJECTION_STATE_CAUGHT_UP = 1;
  PROJECTION_STATE_PENDING = 2;
}

enum MergeStatus {
  MERGE_STATUS_SUCCESS = 0;
  MERGE_STATUS_CONFLICT = 1;
  MERGE_STATUS_ERROR = 2;
  MERGE_STATUS_LOCKED = 3;
  MERGE_STATUS_STALE_BASE = 4;
}

message Conflict {
  string file_id = 1;
  repeated string conflicting_slice_ids = 2;
  ConflictType type = 3;
  string message = 4;
  string conflict_id = 5;
  string changeset_id = 6;
  string path = 7;
  int64 base_version = 8;
  int64 current_version = 9;
  string base_hash = 10;
  string ours_hash = 11;
  string theirs_hash = 12;
  string patch = 13;
  bool resolved = 14;
}

enum ConflictType {
  CONFLICT_TYPE_UNSPECIFIED = 0;
  CONFLICT_TYPE_CONTENT = 1;
  CONFLICT_TYPE_OWNERSHIP = 2;
  CONFLICT_TYPE_STALE_BASE = 3;
}

message ListChangesetConflictsRequest {
  string changeset_id = 1;
}

message ListChangesetConflictsResponse {
  string changeset_id = 1;
  repeated Conflict conflicts = 2;
  int32 total_conflicts = 3;
}

message RebaseChangesetRequest {
  string changeset_id = 1;
}

message RebaseChangesetResponse {
  RebaseStatus status = 1;
  string new_base_commit_hash = 2;
  repeated string slice_commits_to_apply = 3;
  repeated Conflict conflicts = 4;
}

message CloseChangesetRequest {
  string changeset_id = 1;
}

message CloseChangesetResponse {
  string changeset_id = 1;
  ChangesetStatus status = 2;
}

message RevertCommitChangeRequest {
  string commit_hash = 1;
  string change_id = 2;  // Optional: revert only one change when provided.
  string slice_id = 3;
  string message = 4;
}

enum RebaseStatus {
  REBASE_STATUS_SUCCESS = 0;
  REBASE_STATUS_CONFLICT = 1;
  REBASE_STATUS_NEEDS_MERGE = 2;
  REBASE_STATUS_ERROR = 3;
}

message ListChangesetsRequest {
  string slice_id = 1;
  ChangesetStatus status_filter = 2;
  int32 limit = 3;
  bool include_all_statuses = 4;
  bool omit_modified_files = 5;
}

message ListChangesetsResponse {
  repeated ChangesetInfo changesets = 1;
}

message ChangesetInfo {
  string changeset_id = 1;
  string changeset_hash = 2;
  string slice_id = 3;
  string base_commit_hash = 4;
  repeated string modified_files = 5;
  ChangesetStatus status = 6;
  string author = 7;
  int64 created_at = 8;
  int64 merged_at = 9;
  string message = 10;
  ReviewStatus review_status = 11;
  ChangesetCISummary ci = 12;
  int32 modified_file_count = 13;
}

message ChangesetCISummary {
  string status = 1;
  string run_id = 2;
  string plan_hash = 3;
  string changeset_version_id = 4;
  int32 required_total = 5;
  int32 required_passed = 6;
  int32 required_failed = 7;
  int32 required_running = 8;
  int32 required_queued = 9;
  bool stale = 10;
}

enum ChangesetStatus {
  PENDING = 0;
  APPROVED = 1;
  REJECTED = 2;
  MERGED = 3;
}

enum ReviewStatus {
  option allow_alias = true;
  READY_FOR_MERGE = 0;
  NEEDS_SYNC = 1;
  NEEDS_REBASE = 1;
  HAS_CONFLICTS = 2;
  REVIEW_STATUS_UNKNOWN = 3;
}

enum ReviewIssueType {
  REVIEW_ISSUE_TYPE_UNSPECIFIED = 0;
  REVIEW_ISSUE_TYPE_STALE_BASE = 1;
  REVIEW_ISSUE_TYPE_CONTENT_CONFLICT = 2;
  REVIEW_ISSUE_TYPE_OWNERSHIP_CONFLICT = 3;
}

message ReviewIssue {
  ReviewIssueType type = 1;
  string file_id = 2;
  repeated string conflicting_slice_ids = 3;
  string message = 4;
}

message CommitHistoryRequest {
  string slice_id = 1;
  int64 limit = 2;
  string from_commit_hash = 3;
  file.v1.SliceStateToken state_token = 4;
}

message CommitHistoryResponse {
  repeated CommitInfo commits = 1;
  file.v1.SliceStateToken state_token = 2;
}

message CommitInfo {
  string commit_hash = 1;
  int64 timestamp = 2;
  string parent_hash = 3;
  string message = 4;
}

message StateRequest {
  string slice_id = 1;
}

message StateResponse {
  string latest_commit_hash = 1;
  repeated string modified_files = 2;
  int64 last_modified = 3;
}

// Request to get root slice info
message GetRootSliceRequest {}

// Response with root slice info
message GetRootSliceResponse {
  string slice_id = 1;
  string commit_hash = 2;
  common.v1.Visibility visibility = 3;
}

message ListSlicesRequest {
  int32 limit = 1;
  int32 offset = 2;
}

message ListSlicesResponse {
  repeated SliceInfo slices = 1;
  int32 total = 2;
}

message SliceInfo {
  string slice_id = 1;
  string name = 2;
  string description = 3;
  repeated string owners = 4;
  int64 created_at = 5;
  int64 updated_at = 6;
  int32 file_count = 7;
  bool is_root = 8;
  string environment = 9;
  string slug = 10;
  repeated FolderMount folder_mounts = 11;
  common.v1.Visibility visibility = 12;
}

message GlobalStateRequest {
  bool include_history = 1;
}

message GlobalStateResponse {
  string global_commit_hash = 1;
  int64 timestamp = 2;
  repeated GlobalCommitHistory history = 3;
}

message GlobalCommitHistory {
  string commit_hash = 1;
  int64 timestamp = 2;
  repeated string merged_slice_ids = 3;
}

message BatchMergeRequest {
  int32 max_slices = 1;
}

message BatchMergeResponse {
  string global_commit_hash = 1;
  int32 merged_slice_count = 2;
  repeated string merged_slice_ids = 3;
  int64 timestamp = 4;
}

message ConflictsRequest {
  string slice_id = 1;
}

message ConflictsResponse {
  repeated Conflict conflicts = 1;
  int32 total_conflicts = 2;
}

message ResolveConflictRequest {
  string file_id = 1;
  string preferred_slice_id = 2;
}

message ResolveConflictResponse {
  Conflict resolved_conflict = 1;
}

message WatchConflictsRequest {
  string slice_id = 1;
}

message ConflictUpdate {
  repeated Conflict new_conflicts = 1;
  repeated Conflict resolved_conflicts = 2;
}

message ImportGitRepoRequest {
  // Remote git URL to clone on the server host.
  string repo_url = 1;

  // Git ref to import (default: "HEAD").
  string ref = 2;

  // User-visible absolute mount path under the signed-in user's home directory.
  // Defaults to "/<username>/<repo-name>".
  string mount_path = 3;

  // If true, import the first-parent linear history.
  bool first_parent = 4;

  // Optional cap for number of commits imported. The server enforces an upper bound.
  int32 max_commits = 5;
}

message ImportGitRepoResponse {
  int32 imported_commits = 1;
  string head_commit_hash = 2;
  repeated string warnings = 3;
  string slice_id = 4;
  string mount_path = 5;
}

// Request to create a slice from an existing folder
message CreateSliceFromFolderRequest {
  string parent_slice_id = 1;
  reserved 2;
  reserved "folder_path";
  string new_slice_id = 3;
  string name = 4;
  string description = 5;
  repeated string folder_paths = 6;
}

// Response for slice creation from folder
message CreateSliceFromFolderResponse {
  string slice_id = 1;
  string status = 2;
  repeated string files = 3;
  string name = 4;
  string slug = 5;
  common.v1.Visibility visibility = 6;
}

// Request to rename a slice
message RenameSliceRequest {
  string slice_id = 1;
  string new_name = 2;
}

// Response for slice rename
message RenameSliceResponse {
  string slice_id = 1;
  string name = 2;
  string slug = 3;
}

// Request to delete a custom slice.
message DeleteSliceRequest {
  string slice_id = 1;
  bool force = 2;
}

// Response for slice deletion.
message DeleteSliceResponse {
  string slice_id = 1;
  string slug = 2;
  string status = 3;
}

// Request to get a slice by display name
message GetSliceByNameRequest {
  string name = 1;
}

// Response with slice info looked up by name
message GetSliceByNameResponse {
  string slice_id = 1;
  string name = 2;
  string description = 3;
  string parent_slice_id = 4;
  repeated string files = 5;
  string environment = 6;
  string slug = 7;
  common.v1.Visibility visibility = 8;
}

message GetSliceBySlugRequest {
  string slug = 1;
}

message GetSliceBySlugResponse {
  string slice_id = 1;
  string name = 2;
  string description = 3;
  string parent_slice_id = 4;
  repeated string files = 5;
  string environment = 6;
  string slug = 7;
  common.v1.Visibility visibility = 8;
}

message ResolveSliceRequest {
  string ref = 1;
}

message ResolveSliceResponse {
  string slice_id = 1;
  string name = 2;
  string description = 3;
  string parent_slice_id = 4;
  repeated string files = 5;
  string environment = 6;
  string slug = 7;
  common.v1.Visibility visibility = 8;
}

message GetSliceVisibilityRequest {
  string slice_id = 1;
}

message GetSliceVisibilityResponse {
  string slice_id = 1;
  common.v1.Visibility visibility = 2;
}

message SetSliceVisibilityRequest {
  string slice_id = 1;
  common.v1.Visibility visibility = 2;
}

message SetSliceVisibilityResponse {
  string slice_id = 1;
  common.v1.Visibility visibility = 2;
}

// Request to add a tracked folder to a custom slice.
message AddSliceFolderRequest {
  string slice_id = 1;
  string folder_path = 2;
}

// Response after adding a tracked folder.
message AddSliceFolderResponse {
  string slice_id = 1;
  repeated FolderMount folder_mounts = 2;
  repeated string files = 3;
}

// Request to remove a tracked folder from a custom slice.
message RemoveSliceFolderRequest {
  string slice_id = 1;
  string folder_path = 2;
}

// Response after removing a tracked folder.
message RemoveSliceFolderResponse {
  string slice_id = 1;
  repeated FolderMount folder_mounts = 2;
  repeated string files = 3;
}

// FolderMount maps a source folder path in the parent slice to a folder alias.
message FolderMount {
  string source_path = 1;
  string alias = 2;
}

message GetSliceEnvRequirementsRequest {
  string slice_id = 1;
}

message GetSliceEnvRequirementsResponse {
  string slice_id = 1;
  string home_id = 2;
  string slice_slug = 3;
  string requirements_path = 4;
  string requirements_hash = 5;
  bool found = 6;
  SliceEnvRequirements requirements = 7;
  repeated SliceEnvIssue issues = 8;
}

message SliceEnvRequirements {
  int32 version = 1;
  repeated string profiles = 2;
  repeated string ignored_paths = 3;
  repeated SliceEnvMaterializedFile files = 4;
}

message SliceEnvMaterializedFile {
  string path = 1;
  string mode = 2;
  bool sensitive = 3;
  repeated string required_secrets = 4;
  repeated string optional_secrets = 5;
  repeated string required_values = 6;
  repeated string optional_values = 7;
  string profile = 8;
}

message SliceEnvIssue {
  string code = 1;
  string path = 2;
  string message = 3;
}

message ListSliceEnvKVRequest {
  string slice_id = 1;
  string profile = 2;
}

message ListSliceEnvKVResponse {
  repeated SliceEnvKVEntry entries = 1;
}

message SliceEnvKVEntry {
  string id = 1;
  string home_id = 2;
  string slice_id = 3;
  string slice_slug = 4;
  string profile = 5;
  string key = 6;
  string class = 7;
  string value = 8;
  string value_hash = 9;
  int64 version = 10;
  string created_by = 11;
  string updated_by = 12;
  int64 created_at = 13;
  int64 updated_at = 14;
  bool has_value = 15;
}

message SetSliceEnvValueRequest {
  string slice_id = 1;
  string profile = 2;
  string key = 3;
  string value = 4;
}

message SetSliceEnvValueResponse {
  SliceEnvKVEntry entry = 1;
}

message SetSliceEnvSecretRequest {
  string slice_id = 1;
  string profile = 2;
  string key = 3;
  string value = 4;
}

message SetSliceEnvSecretResponse {
  SliceEnvKVEntry entry = 1;
}

message DeleteSliceEnvKVRequest {
  string slice_id = 1;
  string profile = 2;
  string class = 3;
  string key = 4;
}

message DeleteSliceEnvKVResponse {
  bool deleted = 1;
}

message RenderSliceEnvMaterializationRequest {
  string slice_id = 1;
  string profile = 2;
  bool strict = 3;
  string commit_hash = 4;
}

message RenderSliceEnvMaterializationResponse {
  string slice_id = 1;
  string home_id = 2;
  string slice_slug = 3;
  string profile = 4;
  string requirements_path = 5;
  string requirements_hash = 6;
  bool found = 7;
  repeated RenderedSliceEnvFile files = 8;
  repeated SliceEnvMissingKV missing_entries = 9;
  repeated SliceEnvKVReference resolved_refs = 10;
  repeated string ignored_paths = 11;
  repeated SliceEnvIssue issues = 12;
}

message RenderedSliceEnvFile {
  string path = 1;
  string mode = 2;
  bool sensitive = 3;
  bytes content = 4;
  repeated string secret_keys = 5;
  repeated string value_keys = 6;
}

message SliceEnvMissingKV {
  string class = 1;
  string key = 2;
  string profile = 3;
}

message SliceEnvKVReference {
  string class = 1;
  string key = 2;
  string profile = 3;
  int64 version = 5;
  string value_hash = 6;
}
