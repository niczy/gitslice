syntax = "proto3";

package admin.v1;

import "google/api/annotations.proto";

option go_package = "github.com/niczy/gitslice/proto;adminv1";

 service AdminService {
  // Login with username for local/dev auth. Returns the same profile payload as Me.
  rpc Login(LoginRequest) returns (MeResponse) {
    option (google.api.http) = {
      post: "/v1/admin/auth/login"
      body: "*"
    };
  }

  // Get current signed-in user profile.
  rpc Me(MeRequest) returns (MeResponse) {
    option (google.api.http) = {
      get: "/v1/me"
    };
  }

  // List organizations for the current user.
  rpc ListOrganizations(ListOrganizationsRequest) returns (ListOrganizationsResponse) {
    option (google.api.http) = {
      get: "/v1/orgs"
    };
  }

  // Create an organization for the current user.
  rpc CreateOrganization(CreateOrganizationRequest) returns (CreateOrganizationResponse) {
    option (google.api.http) = {
      post: "/v1/orgs"
      body: "*"
    };
  }

  // List environments.
  rpc ListEnvironments(ListEnvironmentsRequest) returns (ListEnvironmentsResponse) {
    option (google.api.http) = {
      get: "/v1/environments"
    };
  }

  // Create an environment.
  rpc CreateEnvironment(CreateEnvironmentRequest) returns (EnvironmentInfo) {
    option (google.api.http) = {
      post: "/v1/environments"
      body: "*"
    };
  }

  // Get an environment by name.
  rpc GetEnvironment(GetEnvironmentRequest) returns (EnvironmentInfo) {
    option (google.api.http) = {
      get: "/v1/environments/{name}"
    };
  }

  // Update an environment by name.
  rpc UpdateEnvironment(UpdateEnvironmentRequest) returns (EnvironmentInfo) {
    option (google.api.http) = {
      put: "/v1/environments/{name}"
      body: "*"
    };
  }

  // Delete an environment by name.
  rpc DeleteEnvironment(DeleteEnvironmentRequest) returns (DeleteEnvironmentResponse) {
    option (google.api.http) = {
      delete: "/v1/environments/{name}"
    };
  }

  // Get slice default environment.
  rpc GetSliceEnvironment(GetSliceEnvironmentRequest) returns (SliceEnvironmentResponse) {
    option (google.api.http) = {
      get: "/v1/slices/{slice_id}/environment"
    };
  }

  // Update slice default environment.
  rpc UpdateSliceEnvironment(UpdateSliceEnvironmentRequest) returns (SliceEnvironmentResponse) {
    option (google.api.http) = {
      put: "/v1/slices/{slice_id}/environment"
      body: "*"
    };
  }

  // Trigger batch merge to global
  rpc BatchMerge(BatchMergeRequest) returns (BatchMergeResponse) {
    option (google.api.http) = {
      post: "/v1/global/batch-merge"
      body: "*"
    };
  }

  // Get current conflicts across slices
  rpc GetConflicts(ConflictsRequest) returns (ConflictsResponse) {
    option (google.api.http) = {
      get: "/v1/conflicts"
    };
  }

  // Resolve a conflict by choosing a preferred slice
  rpc ResolveConflict(ResolveConflictRequest) returns (ResolveConflictResponse) {
    option (google.api.http) = {
      post: "/v1/conflicts:resolve"
      body: "*"
    };
  }

  // Get global state
  rpc GetGlobalState(GlobalStateRequest) returns (GlobalStateResponse) {
    option (google.api.http) = {
      get: "/v1/global/state"
    };
  }

 // List slices stored in the system
  rpc ListSlices(ListSlicesRequest) returns (ListSlicesResponse) {
    option (google.api.http) = {
      get: "/v1/slices"
    };
  }

  // Import a local git repository into the root slice commit-by-commit.
  // This is intended for admin/ops use on the server host.
  rpc ImportGitRepo(ImportGitRepoRequest) returns (ImportGitRepoResponse) {
    option (google.api.http) = {
      post: "/v1/import/git"
      body: "*"
    };
  }

  // Stream conflict updates (bidirectional streaming)
  rpc WatchConflicts(WatchConflictsRequest) returns (stream ConflictUpdate);
}

  message BatchMergeRequest {
    int32 max_slices = 1;
  }

 message BatchMergeResponse {
   string global_commit_hash = 1;
   int32 merged_slice_count = 2;
   repeated string merged_slice_ids = 3;
   int64 timestamp = 4;
 }

message ConflictsRequest {
  string slice_id = 1;
}

message ConflictsResponse {
  repeated Conflict conflicts = 1;
  int32 total_conflicts = 2;
}

message ResolveConflictRequest {
  string file_id = 1;
  string preferred_slice_id = 2;
}

message ResolveConflictResponse {
  Conflict resolved_conflict = 1;
}

message Conflict {
  string file_id = 1;
  repeated string conflicting_slice_ids = 2;
}

message GlobalStateRequest {
  bool include_history = 1;
}

message GlobalStateResponse {
  string global_commit_hash = 1;
  int64 timestamp = 2;
  repeated GlobalCommitHistory history = 3;
}

message GlobalCommitHistory {
  string commit_hash = 1;
  int64 timestamp = 2;
  repeated string merged_slice_ids = 3;
}

message ListSlicesRequest {
  int32 limit = 1;
  int32 offset = 2;
}

message ListSlicesResponse {
  repeated SliceInfo slices = 1;
  int32 total = 2;
}

message ImportGitRepoRequest {
  // Local filesystem path to a git checkout on the server host.
  string repo_path = 1;

  // Remote git URL to clone on the server host (e.g. a GitHub URL).
  // Exactly one of repo_path or repo_url must be set.
  string repo_url = 8;

  // Git ref to import (default: "HEAD").
  string ref = 2;

  // Target slice ID (default: root_slice).
  string slice_id = 3;

  // Mount path prefix for imported files (default: "/o/genesis/projects/<repo-name>").
  // The server will store file paths as "<mount_path>/<repo-relative-path>".
  string mount_path = 4;

  // If true, reset the storage namespace before importing.
  bool reset_storage = 5;

  // If true, import the first-parent linear history (recommended; merges are not represented).
  bool first_parent = 6;

  // Optional cap for number of commits imported (0 = no cap).
  int32 max_commits = 7;
}

message ImportGitRepoResponse {
  int32 imported_commits = 1;
  string head_commit_hash = 2;
  repeated string warnings = 3;
}

message SliceInfo {
  string slice_id = 1;
  string name = 2;
  string description = 3;
  repeated string owners = 4;
  int64 created_at = 5;
  int64 updated_at = 6;
  int32 file_count = 7;
  bool is_root = 8;
  string environment = 9;
}

message WatchConflictsRequest {
  string slice_id = 1;
}

message ConflictUpdate {
  repeated Conflict new_conflicts = 1;
  repeated Conflict resolved_conflicts = 2;
}

message LoginRequest {
  string username = 1;
}

message MeRequest {}

message UserInfo {
  string username = 1;
  int64 created_at = 2;
}

message OrganizationInfo {
  string slug = 1;
  string name = 2;
  string created_by = 3;
  int64 created_at = 4;
}

message MeResponse {
  UserInfo user = 1;
  repeated OrganizationInfo organizations = 2;
  int64 now = 3;
}

message ListOrganizationsRequest {}

message ListOrganizationsResponse {
  repeated OrganizationInfo organizations = 1;
}

message CreateOrganizationRequest {
  string name = 1;
  string slug = 2;
}

message CreateOrganizationResponse {
  OrganizationInfo organization = 1;
}

message EnvironmentInfo {
  string name = 1;
  string display_name = 2;
  string provider = 3;
  string provider_id = 4;
  string region = 5;
  string created_by = 6;
  int64 created_at = 7;
  int64 updated_at = 8;
  map<string, string> provider_config = 9;
}

message ListEnvironmentsRequest {
  int32 limit = 1;
  int32 offset = 2;
}

message ListEnvironmentsResponse {
  repeated EnvironmentInfo environments = 1;
}

message CreateEnvironmentRequest {
  string name = 1;
  string display_name = 2;
  string provider = 3;
  string provider_id = 4;
  string region = 5;
  map<string, string> provider_config = 6;
}

message GetEnvironmentRequest {
  string name = 1;
}

message UpdateEnvironmentRequest {
  string name = 1;
  string display_name = 2;
  string provider = 3;
  string provider_id = 4;
  string region = 5;
  map<string, string> provider_config = 6;
}

message DeleteEnvironmentRequest {
  string name = 1;
}

message DeleteEnvironmentResponse {}

message GetSliceEnvironmentRequest {
  string slice_id = 1;
}

message UpdateSliceEnvironmentRequest {
  string slice_id = 1;
  string environment = 2;
}

message SliceEnvironmentResponse {
  string slice_id = 1;
  string environment = 2;
}
