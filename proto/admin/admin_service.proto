syntax = "proto3";

package admin.v1;

import "google/api/annotations.proto";

option go_package = "github.com/niczy/gitslice/proto;adminv1";

service AdminService {
  // Get whether the current signed-in user can use restricted admin operations.
  rpc GetAdminStatus(AdminStatusRequest) returns (AdminStatusResponse) {
    option (google.api.http) = {
      get: "/v1/admin/status"
    };
  }

  // Delete a user account and owned user data. Restricted to configured admin users.
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse) {
    option (google.api.http) = {
      delete: "/v1/admin/users/{username}"
    };
  }

  // Delete a user account by email and owned user data. Restricted to configured admin users.
  rpc DeleteUserByEmail(DeleteUserByEmailRequest) returns (DeleteUserResponse) {
    option (google.api.http) = {
      post: "/v1/admin/users:deleteByEmail"
      body: "*"
    };
  }

  // Backfill deterministic home slices for existing users.
  rpc BackfillHomeSlices(BackfillHomeSlicesRequest) returns (BackfillHomeSlicesResponse) {
    option (google.api.http) = {
      post: "/v1/admin/home-slices:backfill"
      body: "*"
    };
  }
}

message AdminStatusRequest {}

message AdminStatusResponse {
  bool admin_configured = 1;
  bool is_admin = 2;
  string username = 3;
  string primary_email = 4;
}

message DeleteUserRequest {
  string username = 1;
}

message DeleteUserByEmailRequest {
  string email = 1;
}

message DeleteUserResponse {
  string username = 1;
  string primary_email = 2;
  int32 deleted_slices = 3;
  int32 deleted_sessions = 4;
  int32 deleted_agent_keys = 5;
}

message BackfillHomeSlicesRequest {
  repeated string usernames = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message HomeSliceBackfillResult {
  string username = 1;
  string home_slice_id = 2;
  bool created = 3;
  bool seeded = 4;
  int32 files_copied = 5;
  int32 directories_copied = 6;
}

message BackfillHomeSlicesResponse {
  repeated HomeSliceBackfillResult results = 1;
  int32 processed = 2;
  int32 created = 3;
  int32 seeded = 4;
}
