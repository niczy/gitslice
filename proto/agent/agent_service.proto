syntax = "proto3";

package agent.v1;

option go_package = "github.com/niczy/gitslice/proto/agent;agentv1";

import "google/api/annotations.proto";
import "agent_protocol.proto";

service AgentService {
  rpc RegisterRunner(RegisterRunnerRequest) returns (RegisterRunnerResponse) {
    option (google.api.http) = {
      post: "/v1/agent-runners"
      body: "*"
    };
  }

  rpc HeartbeatRunner(HeartbeatRunnerRequest) returns (HeartbeatRunnerResponse) {
    option (google.api.http) = {
      post: "/v1/agent-runners/{runner_id}:heartbeat"
      body: "*"
    };
  }

  rpc ListRunners(ListRunnersRequest) returns (ListRunnersResponse) {
    option (google.api.http) = {
      get: "/v1/agent-runners"
    };
  }

  rpc UnregisterRunner(UnregisterRunnerRequest) returns (UnregisterRunnerResponse) {
    option (google.api.http) = {
      post: "/v1/agent-runners/{runner_id}:unregister"
      body: "*"
    };
  }

  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse) {
    option (google.api.http) = {
      get: "/v1/agent-sessions"
    };
  }

  rpc CreateSession(CreateSessionRequest) returns (CreateSessionResponse) {
    option (google.api.http) = {
      post: "/v1/agent-sessions"
      body: "*"
    };
  }

  rpc GetSession(GetSessionRequest) returns (GetSessionResponse) {
    option (google.api.http) = {
      get: "/v1/agent-sessions/{session_id}"
    };
  }

  rpc StopSession(StopSessionRequest) returns (StopSessionResponse) {
    option (google.api.http) = {
      post: "/v1/agent-sessions/{session_id}/stop"
      body: "*"
    };
  }

  rpc MintToken(MintTokenRequest) returns (MintTokenResponse) {
    option (google.api.http) = {
      post: "/v1/agent-sessions/{session_id}/token"
    };
  }

  rpc ListEvents(ListEventsRequest) returns (ListEventsResponse) {
    option (google.api.http) = {
      get: "/v1/agent-sessions/{session_id}/events"
    };
  }

  rpc AppendEvent(AppendEventRequest) returns (AppendEventResponse) {
    option (google.api.http) = {
      post: "/v1/agent-sessions/{session_id}/events"
      body: "*"
    };
  }

  rpc SendInput(SendInputRequest) returns (SendInputResponse) {
    option (google.api.http) = {
      post: "/v1/agent-sessions/{session_id}/input"
      body: "*"
    };
  }

  rpc SendInterrupt(SendInterruptRequest) returns (SendInterruptResponse) {
    option (google.api.http) = {
      post: "/v1/agent-sessions/{session_id}/interrupt"
      body: "*"
    };
  }

  rpc ListCapabilities(ListCapabilitiesRequest) returns (ListCapabilitiesResponse) {
    option (google.api.http) = {
      get: "/v1/agent-sessions/capabilities"
    };
  }
}

message CreateSessionRequest {
  string slice_id = 1;
  // Deprecated: ignored. Runtime selection is local-runner-only.
  string provider = 2;
  // Deprecated: ignored. Cloud sandbox runtimes are not active.
  string e2b_template_id = 3;
  // Deprecated: ignored. Cloud sandbox runtimes are not active.
  string e2b_region = 4;
  int32 idle_timeout_sec = 5;
  int32 ttl_sec = 6;
  map<string, string> env = 7;
  // Deprecated: ignored. Sessions are assigned directly to a runner.
  string environment = 8;
  // Optional agent type. Defaults to "codex" when omitted.
  string agent_type = 9;
  // Required local runner to assign this session to.
  string runner_id = 10;
}

message AgentSessionSummary {
  string session_id = 1;
  string slice_id = 2;
  // Deprecated: retained for compatibility during migration.
  string provider = 3;
  string state = 4;
  string created_at = 5;
  string last_activity_at = 6;
  string environment = 7;
  string agent_type = 8;
  string runner_id = 9;
}

message ListSessionsRequest {
  string slice_id = 1;
  int32 limit = 2;
}

message ListSessionsResponse {
  repeated AgentSessionSummary sessions = 1;
}

message WSConnectInfo {
  string url = 1;
  string token = 2;
  string expires_at = 3;
}

message CreateSessionResponse {
  string session_id = 1;
  string slice_id = 2;
  // Deprecated: retained for compatibility during migration.
  string provider = 3;
  // Deprecated: retained for compatibility during migration.
  string e2b_template_id = 4;
  string state = 5;
  WSConnectInfo ws = 6;
  string created_at = 7;
  int32 idle_timeout_sec = 8;
  int32 ttl_sec = 9;
  string environment = 10;
  string agent_type = 11;
  string runner_id = 12;
}

message GetSessionRequest {
  string session_id = 1;
}

message RuntimeInfo {
  string endpoint = 1;
}

message GetSessionResponse {
  string session_id = 1;
  string slice_id = 2;
  // Deprecated: retained for compatibility during migration.
  string provider = 3;
  // Deprecated: retained for compatibility during migration.
  string e2b_sandbox_id = 4;
  string state = 5;
  string last_activity_at = 6;
  int32 idle_timeout_sec = 7;
  int32 ttl_sec = 8;
  string created_at = 9;
  RuntimeInfo runtime = 10;
  string environment = 11;
  string agent_type = 12;
  string runner_id = 13;
}

message StopSessionRequest {
  string session_id = 1;
  string reason = 2;
}

message StopSessionResponse {
  string session_id = 1;
  string state = 2;
}

message MintTokenRequest {
  string session_id = 1;
}

message MintTokenResponse {
  string url = 1;
  string token = 2;
  string expires_at = 3;
}

message ListEventsRequest {
  string session_id = 1;
  uint64 since_seq = 2;
  int32 limit = 3;
}

message ListEventsResponse {
  repeated EventEnvelope events = 1;
  uint64 next_seq = 2;
}

message AppendEventRequest {
  string session_id = 1;
  string stream = 2;
  string type = 3;
  bytes payload = 4;
}

message AppendEventResponse {
  EventEnvelope event = 1;
}

message SendInputRequest {
  string session_id = 1;
  string text = 2;
}

message SendInputResponse {
  bool accepted = 1;
}

message SendInterruptRequest {
  string session_id = 1;
  string reason = 2;
}

message SendInterruptResponse {
  bool accepted = 1;
}

message ListCapabilitiesRequest {}

message ListCapabilitiesResponse {
  repeated string supported_agent_types = 1;
  string default_agent_type = 2;
  repeated string supported_runtime_providers = 3;
  string default_runtime_provider = 4;
}

message AgentRunner {
  string runner_id = 1;
  string provider = 2;
  string agent_type = 3;
  string status = 4;
  string host_name = 5;
  int32 pid = 6;
  string workspace_root = 7;
  string version = 8;
  bytes capabilities = 9;
  string last_heartbeat_at = 10;
  string created_at = 11;
  string updated_at = 12;
}

message RegisterRunnerRequest {
  string runner_id = 1;
  string provider = 2;
  string agent_type = 3;
  string host_name = 4;
  int32 pid = 5;
  string workspace_root = 6;
  string version = 7;
  bytes capabilities = 8;
}

message RegisterRunnerResponse {
  AgentRunner runner = 1;
  int32 heartbeat_interval_sec = 2;
}

message HeartbeatRunnerRequest {
  string runner_id = 1;
  string status = 2;
  string host_name = 3;
  int32 pid = 4;
  string workspace_root = 5;
  bytes capabilities = 6;
}

message HeartbeatRunnerResponse {
  AgentRunner runner = 1;
  int32 heartbeat_interval_sec = 2;
}

message ListRunnersRequest {
  int32 limit = 1;
  bool include_offline = 2;
}

message ListRunnersResponse {
  repeated AgentRunner runners = 1;
}

message UnregisterRunnerRequest {
  string runner_id = 1;
  string reason = 2;
}

message UnregisterRunnerResponse {
  AgentRunner runner = 1;
}
