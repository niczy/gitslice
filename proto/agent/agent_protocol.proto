syntax = "proto3";

package agent.v1;

option go_package = "github.com/niczy/gitslice/proto/agent;agentv1";

// EventEnvelope is the durable session event shape shared by the web UI,
// remote runtimes, and local agent runners.
message EventEnvelope {
  uint64 seq = 1;
  string ts = 2;
  string stream = 3;
  string type = 4;
  bytes payload = 5;
  // Stable server-side category for storage/query/UI rendering. Examples:
  // thinking, tool_call, tool_result, model_response, user_input.
  string kind = 6;
}

message AgentInputPayload {
  string text = 1;
}

message AgentInterruptPayload {
  string reason = 1;
}

message AgentOutputPayload {
  string text = 1;
  string channel = 2;
  int32 exit_code = 3;
}

message AgentThinkingPayload {
  string text = 1;
  string channel = 2;
  string turn_id = 3;
  string item_id = 4;
}

message AgentErrorPayload {
  string code = 1;
  string message = 2;
}

message AgentStatePayload {
  string state = 1;
}

message AgentPtyInputPayload {
  string data = 1;
}

message AgentPtyResizePayload {
  int32 rows = 1;
  int32 cols = 2;
}
