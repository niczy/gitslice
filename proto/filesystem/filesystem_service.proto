syntax = "proto3";

package filesystem.v1;

option go_package = "github.com/niczy/gitslice/proto/filesystem;filesystemv1";

import "common/visibility.proto";
import "google/api/annotations.proto";

service FilesystemService {
  rpc CreateWorkspace(CreateWorkspaceRequest) returns (WorkspaceInfo) {
    option (google.api.http) = {
      post: "/v1/fs/workspaces"
      body: "*"
    };
  }

  rpc DeleteWorkspace(DeleteWorkspaceRequest) returns (DeleteWorkspaceResponse) {
    option (google.api.http) = {
      delete: "/v1/fs/workspaces/{workspace_id}"
    };
  }

  rpc ListWorkspaces(ListWorkspacesRequest) returns (ListWorkspacesResponse) {
    option (google.api.http) = {
      get: "/v1/fs/workspaces"
    };
  }

  rpc GetWorkspaceInfo(GetWorkspaceInfoRequest) returns (WorkspaceInfo) {
    option (google.api.http) = {
      get: "/v1/fs/workspaces/{workspace_id}"
    };
  }

  rpc ReadFile(ReadFileRequest) returns (ReadFileResponse) {
    option (google.api.http) = {
      get: "/v1/fs/workspaces/{workspace_id}/files/{path=**}"
    };
  }

  rpc WriteFile(WriteFileRequest) returns (WriteFileResponse) {
    option (google.api.http) = {
      put: "/v1/fs/workspaces/{workspace_id}/files/{path=**}"
      body: "*"
    };
  }

  rpc EditFile(EditFileRequest) returns (EditFileResponse) {
    option (google.api.http) = {
      post: "/v1/fs/workspaces/{workspace_id}:editFile"
      body: "*"
    };
  }

  rpc EditFiles(EditFilesRequest) returns (EditFilesResponse) {
    option (google.api.http) = {
      post: "/v1/fs/workspaces/{workspace_id}:editFiles"
      body: "*"
    };
  }

  rpc DeleteFile(DeleteFileRequest) returns (DeleteFileResponse) {
    option (google.api.http) = {
      delete: "/v1/fs/workspaces/{workspace_id}/files/{path=**}"
    };
  }

  rpc MoveFile(MoveFileRequest) returns (MoveFileResponse) {
    option (google.api.http) = {
      post: "/v1/fs/workspaces/{workspace_id}:move"
      body: "*"
    };
  }

  rpc CopyFile(CopyFileRequest) returns (CopyFileResponse) {
    option (google.api.http) = {
      post: "/v1/fs/workspaces/{workspace_id}:copy"
      body: "*"
    };
  }

  rpc ListDirectory(ListDirectoryRequest) returns (ListDirectoryResponse) {
    option (google.api.http) = {
      get: "/v1/fs/workspaces/{workspace_id}/ls"
      additional_bindings { get: "/v1/fs/workspaces/{workspace_id}/ls/{path=**}" }
    };
  }

  rpc MakeDirectory(MakeDirectoryRequest) returns (MakeDirectoryResponse) {
    option (google.api.http) = {
      post: "/v1/fs/workspaces/{workspace_id}/mkdir/{path=**}"
      body: "*"
    };
  }

  rpc Stat(StatRequest) returns (StatResponse) {
    option (google.api.http) = {
      get: "/v1/fs/workspaces/{workspace_id}/stat"
      additional_bindings { get: "/v1/fs/workspaces/{workspace_id}/stat/{path=**}" }
    };
  }

  rpc GetPathVisibility(GetPathVisibilityRequest) returns (GetPathVisibilityResponse) {
    option (google.api.http) = {
      get: "/v1/fs:visibility"
    };
  }

  rpc SetPathVisibility(SetPathVisibilityRequest) returns (SetPathVisibilityResponse) {
    option (google.api.http) = {
      post: "/v1/fs:visibility"
      body: "*"
    };
  }

  rpc Exists(ExistsRequest) returns (ExistsResponse) {
    option (google.api.http) = {
      get: "/v1/fs/workspaces/{workspace_id}/exists"
      additional_bindings { get: "/v1/fs/workspaces/{workspace_id}/exists/{path=**}" }
    };
  }

  rpc ReadFiles(ReadFilesRequest) returns (ReadFilesResponse) {
    option (google.api.http) = {
      post: "/v1/fs/workspaces/{workspace_id}:readFiles"
      body: "*"
    };
  }

  rpc WriteFiles(WriteFilesRequest) returns (WriteFilesResponse) {
    option (google.api.http) = {
      post: "/v1/fs/workspaces/{workspace_id}:writeFiles"
      body: "*"
    };
  }

  rpc Batch(BatchRequest) returns (BatchResponse) {
    option (google.api.http) = {
      post: "/v1/fs/workspaces/{workspace_id}:batch"
      body: "*"
    };
  }

  rpc PlanUpload(PlanUploadRequest) returns (PlanUploadResponse) {
    option (google.api.http) = {
      post: "/v1/fs/workspaces/{workspace_id}:planUpload"
      body: "*"
    };
  }

  rpc FinalizeUpload(FinalizeUploadRequest) returns (FinalizeUploadResponse) {
    option (google.api.http) = {
      post: "/v1/fs/workspaces/{workspace_id}:finalizeUpload"
      body: "*"
    };
  }

  rpc Glob(GlobRequest) returns (GlobResponse) {
    option (google.api.http) = {
      get: "/v1/fs/workspaces/{workspace_id}:glob"
    };
  }

  rpc Search(SearchRequest) returns (SearchResponse) {
    option (google.api.http) = {
      get: "/v1/fs/workspaces/{workspace_id}:search"
    };
  }

  rpc Snapshot(SnapshotRequest) returns (SnapshotResponse) {
    option (google.api.http) = {
      post: "/v1/fs/workspaces/{workspace_id}/snapshot"
      body: "*"
    };
  }

  rpc ListSnapshots(ListSnapshotsRequest) returns (ListSnapshotsResponse) {
    option (google.api.http) = {
      get: "/v1/fs/workspaces/{workspace_id}/snapshots"
    };
  }

  rpc RestoreSnapshot(RestoreSnapshotRequest) returns (RestoreSnapshotResponse) {
    option (google.api.http) = {
      post: "/v1/fs/workspaces/{workspace_id}/restore/{snapshot_id}"
      body: "*"
    };
  }

  rpc Diff(DiffRequest) returns (DiffResponse) {
    option (google.api.http) = {
      post: "/v1/fs/workspaces/{workspace_id}:diff"
      body: "*"
    };
  }

  rpc Fork(ForkRequest) returns (ForkResponse) {
    option (google.api.http) = {
      post: "/v1/fs/workspaces/{workspace_id}/fork"
      body: "*"
    };
  }

  rpc Merge(MergeRequest) returns (MergeResponse) {
    option (google.api.http) = {
      post: "/v1/fs/workspaces/{workspace_id}/merge"
      body: "*"
    };
  }

  rpc ListConflicts(ListConflictsRequest) returns (ListConflictsResponse) {
    option (google.api.http) = {
      get: "/v1/fs/workspaces/{workspace_id}/conflicts"
    };
  }

  rpc ResolveConflict(ResolveConflictRequest) returns (ResolveConflictResponse) {
    option (google.api.http) = {
      post: "/v1/fs/workspaces/{workspace_id}/conflicts:resolve"
      body: "*"
    };
  }

  rpc ImportRepo(ImportRepoRequest) returns (ImportRepoResponse) {
    option (google.api.http) = {
      post: "/v1/repos/import"
      body: "*"
    };
  }

  rpc ListRepoBindings(ListRepoBindingsRequest) returns (ListRepoBindingsResponse) {
    option (google.api.http) = {
      get: "/v1/repos/bindings"
    };
  }

  rpc PullRepoBinding(PullRepoBindingRequest) returns (PullRepoBindingResponse) {
    option (google.api.http) = {
      post: "/v1/repos/pull"
      body: "*"
    };
  }

  rpc PushRepoBinding(PushRepoBindingRequest) returns (PushRepoBindingResponse) {
    option (google.api.http) = {
      post: "/v1/repos/push"
      body: "*"
    };
  }

  rpc DeleteRepoBinding(DeleteRepoBindingRequest) returns (DeleteRepoBindingResponse) {
    option (google.api.http) = {
      post: "/v1/repos/unlink"
      body: "*"
    };
  }

  rpc StreamRead(StreamReadRequest) returns (stream StreamReadResponse);
  rpc StreamWrite(stream StreamWriteRequest) returns (StreamWriteResponse);
  rpc UploadBlocks(stream UploadBlocksRequest) returns (UploadBlocksResponse);
}

message CreateWorkspaceRequest {
  string workspace_id = 1;
  string name = 2;
  string description = 3;
}

message DeleteWorkspaceRequest {
  string workspace_id = 1;
}

message DeleteWorkspaceResponse {
  string workspace_id = 1;
}

message ListWorkspacesRequest {
  int32 limit = 1;
  int32 offset = 2;
}

message GetWorkspaceInfoRequest {
  string workspace_id = 1;
}

message WorkspaceInfo {
  string workspace_id = 1;
  string name = 2;
  string description = 3;
  string created_by = 4;
  repeated string owners = 5;
  string head_commit_hash = 6;
  int64 created_at = 7;
  int64 updated_at = 8;
  int32 path_count = 9;
  int32 file_count = 10;
  bool is_root = 11;
  common.v1.Visibility visibility = 12;
}

message ListWorkspacesResponse {
  repeated WorkspaceInfo workspaces = 1;
  int32 total = 2;
}

message ReadFileRequest {
  string workspace_id = 1;
  string path = 2;
  // Zero-based byte offset within the file. When byte_limit is 0, reads to EOF.
  int64 byte_offset = 3;
  // Maximum number of bytes to return. A value of 0 means no byte limit.
  int64 byte_limit = 4;
  // Zero-based line offset within the file. When line_limit is 0, reads to EOF.
  int64 line_offset = 5;
  // Maximum number of lines to return. A value of 0 means no line limit.
  int64 line_limit = 6;
}

message ReadFileResponse {
  string workspace_id = 1;
  string path = 2;
  bytes content = 3;
  // Total file size, even when content contains a partial range.
  int64 size = 4;
  string hash = 5;
}

message WriteFileRequest {
  string workspace_id = 1;
  string path = 2;
  bytes content = 3;
}

message WriteFileResponse {
  string workspace_id = 1;
  string path = 2;
  int64 size = 3;
  string hash = 4;
  string commit_hash = 5;
}

message FileEdit {
  string old_text = 1;
  string new_text = 2;
}

message EditFileRequest {
  string workspace_id = 1;
  string path = 2;
  repeated FileEdit edits = 3;
  string expected_hash = 4;
}

message EditFileResponse {
  string workspace_id = 1;
  string path = 2;
  int64 size = 3;
  string hash = 4;
  string commit_hash = 5;
}

message EditFileInput {
  string path = 1;
  repeated FileEdit edits = 2;
  string expected_hash = 3;
}

message EditFileResult {
  string path = 1;
  int64 size = 2;
  string hash = 3;
}

message EditFilesRequest {
  string workspace_id = 1;
  repeated EditFileInput files = 2;
}

message EditFilesResponse {
  string workspace_id = 1;
  repeated EditFileResult files = 2;
  string commit_hash = 3;
}

message DeleteFileRequest {
  string workspace_id = 1;
  string path = 2;
}

message DeleteFileResponse {
  string workspace_id = 1;
  string path = 2;
  string commit_hash = 3;
}

message MoveFileRequest {
  string workspace_id = 1;
  string source_path = 2;
  string destination_path = 3;
}

message MoveFileResponse {
  string workspace_id = 1;
  string source_path = 2;
  string destination_path = 3;
  string commit_hash = 4;
}

message CopyFileRequest {
  string workspace_id = 1;
  string source_path = 2;
  string destination_path = 3;
}

message CopyFileResponse {
  string workspace_id = 1;
  string source_path = 2;
  string destination_path = 3;
  int64 size = 4;
  string hash = 5;
  string commit_hash = 6;
}

enum EntryType {
  ENTRY_TYPE_UNSPECIFIED = 0;
  ENTRY_TYPE_FILE = 1;
  ENTRY_TYPE_DIRECTORY = 2;
}

message WorkspaceEntry {
  string name = 1;
  string path = 2;
  EntryType type = 3;
  int64 size = 4;
  string hash = 5;
  common.v1.Visibility effective_visibility = 6;
}

message ListDirectoryRequest {
  string workspace_id = 1;
  string path = 2;
}

message ListDirectoryResponse {
  string workspace_id = 1;
  string path = 2;
  repeated WorkspaceEntry entries = 3;
}

message MakeDirectoryRequest {
  string workspace_id = 1;
  string path = 2;
}

message MakeDirectoryResponse {
  string workspace_id = 1;
  string path = 2;
  string commit_hash = 3;
}

message StatRequest {
  string workspace_id = 1;
  string path = 2;
}

message StatResponse {
  bool exists = 1;
  WorkspaceEntry entry = 2;
}

message PathVisibilityInfo {
  string path = 1;
  common.v1.Visibility visibility = 2;
  bool explicit_rule = 3;
  string resolved_from_path = 4;
  common.v1.Visibility effective_visibility = 5;
}

message GetPathVisibilityRequest {
  string workspace_id = 1;
  string path = 2;
}

message GetPathVisibilityResponse {
  string workspace_id = 1;
  PathVisibilityInfo visibility = 2;
}

message SetPathVisibilityRequest {
  string path = 1;
  common.v1.Visibility visibility = 2;
  bool recursive = 3;
}

message SetPathVisibilityResponse {
  PathVisibilityInfo visibility = 1;
  bool recursive = 2;
}

message ExistsRequest {
  string workspace_id = 1;
  string path = 2;
}

message ExistsResponse {
  bool exists = 1;
}

message ReadFilesRequest {
  string workspace_id = 1;
  repeated string paths = 2;
}

message ReadFileResult {
  string path = 1;
  bytes content = 2;
  int64 size = 3;
  string hash = 4;
  bool found = 5;
  string error = 6;
}

message ReadFilesResponse {
  string workspace_id = 1;
  repeated ReadFileResult files = 2;
}

message WriteFileInput {
  string path = 1;
  bytes content = 2;
}

message WriteFileResult {
  string path = 1;
  int64 size = 2;
  string hash = 3;
}

message WriteFilesRequest {
  string workspace_id = 1;
  repeated WriteFileInput files = 2;
}

message WriteFilesResponse {
  string workspace_id = 1;
  repeated WriteFileResult files = 2;
  string commit_hash = 3;
}

enum BatchOperationType {
  BATCH_OPERATION_TYPE_UNSPECIFIED = 0;
  BATCH_OPERATION_TYPE_WRITE = 1;
  BATCH_OPERATION_TYPE_EDIT = 2;
  BATCH_OPERATION_TYPE_DELETE = 3;
  BATCH_OPERATION_TYPE_MOVE = 4;
  BATCH_OPERATION_TYPE_COPY = 5;
  BATCH_OPERATION_TYPE_MKDIR = 6;
}

message BatchWriteOperation {
  string path = 1;
  bytes content = 2;
}

message BatchEditOperation {
  string path = 1;
  repeated FileEdit edits = 2;
  string expected_hash = 3;
}

message BatchDeleteOperation {
  string path = 1;
}

message BatchMoveOperation {
  string source_path = 1;
  string destination_path = 2;
}

message BatchCopyOperation {
  string source_path = 1;
  string destination_path = 2;
}

message BatchMkdirOperation {
  string path = 1;
}

message BatchOperation {
  string id = 1;
  oneof operation {
    BatchWriteOperation write = 2;
    BatchEditOperation edit = 3;
    BatchDeleteOperation delete = 4;
    BatchMoveOperation move = 5;
    BatchCopyOperation copy = 6;
    BatchMkdirOperation mkdir = 7;
  }
}

message BatchRequest {
  string workspace_id = 1;
  repeated BatchOperation operations = 2;
  string message = 3;
}

message BatchResult {
  string id = 1;
  BatchOperationType op_type = 2;
  string path = 3;
  string source_path = 4;
  string destination_path = 5;
  int64 size = 6;
  string hash = 7;
}

message BatchResponse {
  string workspace_id = 1;
  repeated BatchResult results = 2;
  string commit_hash = 3;
}

message UploadBlockRef {
  string hash = 1;
  int64 size = 2;
}

message UploadFileManifest {
  string path = 1;
  int64 size = 2;
  string hash = 3;
  repeated UploadBlockRef blocks = 4;
}

message PlanUploadRequest {
  string workspace_id = 1;
  repeated UploadFileManifest files = 2;
}

message PlanUploadResponse {
  string workspace_id = 1;
  repeated string missing_block_hashes = 2;
  repeated string skipped_paths = 3;
  int32 file_count = 4;
  int32 missing_block_count = 5;
  int64 missing_bytes = 6;
}

message FinalizeUploadRequest {
  string workspace_id = 1;
  repeated string directories = 2;
  repeated UploadFileManifest files = 3;
  string message = 4;
}

message FinalizeUploadResponse {
  string workspace_id = 1;
  string commit_hash = 2;
  int32 files_written = 3;
  int32 files_skipped = 4;
  int32 directories_written = 5;
}

message GlobRequest {
  string workspace_id = 1;
  string pattern = 2;
}

message GlobResponse {
  string workspace_id = 1;
  string pattern = 2;
  repeated string paths = 3;
}

message SearchRequest {
  string workspace_id = 1;
  string query = 2;
  string glob = 3;
}

message SearchMatch {
  string path = 1;
  int32 line_number = 2;
  string line = 3;
  int32 match_start = 4;
  int32 match_end = 5;
}

message SearchResponse {
  string workspace_id = 1;
  string query = 2;
  string glob = 3;
  repeated SearchMatch matches = 4;
}

message SnapshotInfo {
  string snapshot_id = 1;
  string parent_snapshot_id = 2;
  string message = 3;
  int64 created_at = 4;
  int32 file_count = 5;
}

message SnapshotRequest {
  string workspace_id = 1;
  string message = 2;
}

message SnapshotResponse {
  string workspace_id = 1;
  SnapshotInfo snapshot = 2;
}

message ListSnapshotsRequest {
  string workspace_id = 1;
  int32 limit = 2;
  string from_snapshot_id = 3;
}

message ListSnapshotsResponse {
  string workspace_id = 1;
  repeated SnapshotInfo snapshots = 2;
}

message RestoreSnapshotRequest {
  string workspace_id = 1;
  string snapshot_id = 2;
  string message = 3;
}

message RestoreSnapshotResponse {
  string workspace_id = 1;
  string restored_snapshot_id = 2;
  SnapshotInfo snapshot = 3;
}

enum DiffChangeType {
  DIFF_CHANGE_TYPE_UNSPECIFIED = 0;
  DIFF_CHANGE_TYPE_ADD = 1;
  DIFF_CHANGE_TYPE_MODIFY = 2;
  DIFF_CHANGE_TYPE_DELETE = 3;
}

message DiffRequest {
  string workspace_id = 1;
  string from_snapshot_id = 2;
  string to_snapshot_id = 3;
  bool include_patches = 4;
}

message DiffSummary {
  int32 files_added = 1;
  int32 files_modified = 2;
  int32 files_deleted = 3;
  int32 lines_added = 4;
  int32 lines_deleted = 5;
}

message FileDiff {
  string path = 1;
  DiffChangeType change_type = 2;
  string old_hash = 3;
  string new_hash = 4;
  int32 lines_added = 5;
  int32 lines_deleted = 6;
  string patch = 7;
}

message DiffResponse {
  string workspace_id = 1;
  string from_snapshot_id = 2;
  string to_snapshot_id = 3;
  DiffSummary summary = 4;
  repeated FileDiff files = 5;
}

message ForkRequest {
  string workspace_id = 1;
  string fork_workspace_id = 2;
  string name = 3;
  string description = 4;
  string snapshot_id = 5;
}

message ForkResponse {
  WorkspaceInfo workspace = 1;
  string source_workspace_id = 2;
  string source_snapshot_id = 3;
}

enum MergeStatus {
  MERGE_STATUS_UNSPECIFIED = 0;
  MERGE_STATUS_SUCCESS = 1;
  MERGE_STATUS_CONFLICT = 2;
}

message MergeRequest {
  string workspace_id = 1;
  string source_workspace_id = 2;
  string source_snapshot_id = 3;
  string target_snapshot_id = 4;
  string base_workspace_id = 5;
  string base_snapshot_id = 6;
  string message = 7;
}

message MergeConflict {
  string path = 1;
  string base_hash = 2;
  string source_hash = 3;
  string target_hash = 4;
  DiffChangeType source_change_type = 5;
  DiffChangeType target_change_type = 6;
  string source_patch = 7;
  string target_patch = 8;
}

message MergeResponse {
  string workspace_id = 1;
  string source_workspace_id = 2;
  string base_workspace_id = 3;
  string base_snapshot_id = 4;
  string source_snapshot_id = 5;
  string target_snapshot_id = 6;
  MergeStatus status = 7;
  string commit_hash = 8;
  DiffSummary summary = 9;
  repeated string merged_paths = 10;
  repeated MergeConflict conflicts = 11;
}

message WorkspaceConflict {
  string path = 1;
  repeated string workspace_ids = 2;
}

message ListConflictsRequest {
  string workspace_id = 1;
  string other_workspace_id = 2;
}

message ListConflictsResponse {
  string workspace_id = 1;
  string other_workspace_id = 2;
  repeated WorkspaceConflict conflicts = 3;
}

message ResolveConflictRequest {
  string workspace_id = 1;
  string path = 2;
  string preferred_workspace_id = 3;
}

message ResolveConflictResponse {
  string workspace_id = 1;
  WorkspaceConflict conflict = 2;
}

message StreamReadRequest {
  string workspace_id = 1;
  string path = 2;
  int32 chunk_size = 3;
}

message StreamReadResponse {
  string workspace_id = 1;
  string path = 2;
  bytes content = 3;
  int64 offset = 4;
  int64 size = 5;
  string hash = 6;
  bool eof = 7;
}

message StreamWriteMetadata {
  string workspace_id = 1;
  string path = 2;
}

message StreamWriteRequest {
  oneof chunk {
    StreamWriteMetadata metadata = 1;
    bytes content = 2;
  }
}

message StreamWriteResponse {
  string workspace_id = 1;
  string path = 2;
  int64 size = 3;
  string hash = 4;
  string commit_hash = 5;
}

message UploadBlockMetadata {
  string workspace_id = 1;
  string hash = 2;
  int64 size = 3;
}

message UploadBlocksRequest {
  oneof chunk {
    UploadBlockMetadata metadata = 1;
    bytes content = 2;
  }
}

message UploadBlocksResponse {
  string workspace_id = 1;
  int32 blocks_received = 2;
  int64 bytes_received = 3;
  int32 blocks_written = 4;
  int32 blocks_reused = 5;
}

message RepoBinding {
  string binding_id = 1;
  string provider = 2;
  string repo_url = 3;
  string branch = 4;
  string path = 5;
  bool push_enabled = 6;
  string last_imported_commit = 7;
  string last_pushed_commit = 8;
  string last_seen_remote_commit = 9;
  string created_at = 10;
  string updated_at = 11;
}

message ImportRepoRequest {
  string repo_url = 1;
  string path = 2;
  string branch = 3;
  bool allow_overwrite = 4;
  bool push_enabled = 5;
  string github_token = 6;
}

message ImportRepoResponse {
  RepoBinding binding = 1;
  string commit_hash = 2;
  string remote_commit = 3;
  int32 file_count = 4;
}

message ListRepoBindingsRequest {}

message ListRepoBindingsResponse {
  repeated RepoBinding bindings = 1;
}

message PullRepoBindingRequest {
  string path = 1;
  bool allow_overwrite = 2;
  string github_token = 3;
}

message PullRepoBindingResponse {
  RepoBinding binding = 1;
  string commit_hash = 2;
  string remote_commit = 3;
  int32 file_count = 4;
}

message PushRepoBindingRequest {
  string path = 1;
  string message = 2;
  string github_token = 3;
}

message PushRepoBindingResponse {
  RepoBinding binding = 1;
  string remote_commit = 2;
  bool pushed = 3;
}

message DeleteRepoBindingRequest {
  string path = 1;
}

message DeleteRepoBindingResponse {
  string path = 1;
}
