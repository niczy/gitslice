# Genesis Organization Configuration
# This is the configuration for the genesis organization

[metadata]
owner_type = "organization"
owner_name = "genesis"
description = "Genesis organization - home of the gitslice project and related tools"

[runtime]
# At runtime, the gitslice repository should be mounted at this location
mount_point = "/o/genesis/project/gitslice"
# This tells the system where to place the repository when initializing

[scope]
# Include the entire genesis organization directory
include = [
  "/o/genesis/**/*"
]

# Exclude build artifacts, dependencies, and temporary files
exclude = [
  "/o/genesis/.git/**",
  "/o/genesis/**/node_modules/**",
  "/o/genesis/**/.DS_Store",
  "/o/genesis/**/*.tmp",
  "/o/genesis/project/gitslice/third_party/**",
  "/o/genesis/project/gitslice/web/dist/**",
  "/o/genesis/project/gitslice/web/playwright-report/**",
  "/o/genesis/project/gitslice/web/test-results/**"
]

[slices]
# Default location for genesis organization slices
slices_dir = "/o/genesis/slices"

# The gitslice project itself (will be available after mounting)
[[slices.definitions]]
name = "gitslice"
path = "/o/genesis/project/gitslice"
description = "The gitslice version control system - all source code and documentation"
files = [
  "/o/genesis/project/gitslice/**/*"
]
