# Configuration for the genesis organization
# The genesis organization contains the gitslice source code itself

[scope]
# Include the entire genesis directory
include = [
  "/o/genesis/**/*"
]

# Exclude build artifacts and dependencies
exclude = [
  "/o/genesis/.git/**",
  "/o/genesis/**/node_modules/**",
  "/o/genesis/web/node_modules/**",
  "/o/genesis/**/.DS_Store",
  "/o/genesis/**/*.tmp",
  "/o/genesis/third_party/**",
  "/o/genesis/**/dist/**",
  "/o/genesis/**/build/**"
]

[metadata]
owner_type = "organization"
owner_name = "genesis"
description = "Core gitslice platform and services"

[slices]
# Slices for the genesis org (gitslice development)
slices_dir = "/o/genesis/slices"

# Example organizational slices
[[slices.definitions]]
name = "core-services"
path = "/o/genesis/slices/core-services"
description = "Core slice and admin services"
files = [
  "slice_service/**/*",
  "admin_service/**/*",
  "internal/services/**/*"
]

[[slices.definitions]]
name = "cli"
path = "/o/genesis/slices/cli"
description = "Command-line interface"
files = [
  "gs_cli/**/*"
]

[[slices.definitions]]
name = "web-ui"
path = "/o/genesis/slices/web-ui"
description = "Web interface"
files = [
  "web/**/*"
]
