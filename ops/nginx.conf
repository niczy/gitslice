events {
    worker_connections 1024;
}

http {
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/gitslice.access.log main;
    error_log /var/log/nginx/gitslice.error.log;

    upstream core_service {
        server 127.0.0.1:50051;
    }

    upstream web_app {
        server 127.0.0.1:4173;
    }

    # Do not enable cleartext HTTP/2 (h2c) on port 80. Cloudflare gRPC expects
    # an HTTPS origin with HTTP/2 on 443, so port 80 should only redirect.
    #
    # Cloudflare Origin CA cert/key paths (provided by operator):
    #   - /home/nic/cert/agenttools.dev.pem
    #   - /home/nic/cert/agenttools.dev.pri
    server {
        listen 80;
        server_name agenttools.dev www.agenttools.dev api.agenttools.dev;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name api.agenttools.dev;

        ssl_certificate /home/nic/cert/agenttools.dev.pem;
        ssl_certificate_key /home/nic/cert/agenttools.dev.pri;
        grpc_read_timeout 30m;
        grpc_send_timeout 30m;

        location /slice.v1.SliceService/ {
            grpc_pass grpc://core_service;
            grpc_set_header Host $host;
            grpc_set_header X-Real-IP $remote_addr;
        }

        location /admin.v1.AdminService/ {
            grpc_pass grpc://core_service;
            grpc_set_header Host $host;
            grpc_set_header X-Real-IP $remote_addr;
        }

        location /account.v1.AccountService/ {
            grpc_pass grpc://core_service;
            grpc_set_header Host $host;
            grpc_set_header X-Real-IP $remote_addr;
        }

        location /file.v1.FileService/ {
            grpc_pass grpc://core_service;
            grpc_set_header Host $host;
            grpc_set_header X-Real-IP $remote_addr;
        }

        location /filesystem.v1.FilesystemService/ {
            grpc_pass grpc://core_service;
            grpc_set_header Host $host;
            grpc_set_header X-Real-IP $remote_addr;
        }

        location /agent.v1.AgentService/ {
            grpc_pass grpc://core_service;
            grpc_set_header Host $host;
            grpc_set_header X-Real-IP $remote_addr;
        }

        location ^~ /v1/ {
            proxy_pass http://core_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            return 404;
        }
    }

    server {
        listen 443 ssl http2;
        server_name agenttools.dev www.agenttools.dev;

        ssl_certificate /home/nic/cert/agenttools.dev.pem;
        ssl_certificate_key /home/nic/cert/agenttools.dev.pri;

        location ^~ /v1/ {
            proxy_pass http://core_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://web_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
