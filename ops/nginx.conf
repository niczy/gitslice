events {
    worker_connections 1024;
}

http {
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/gitslice.access.log main;
    error_log /var/log/nginx/gitslice.error.log;

    upstream core_service {
        server 127.0.0.1:50051;
    }

    upstream file_gateway {
        server 127.0.0.1:8080;
    }

    upstream web_app {
        server 127.0.0.1:4173;
    }

    # NOTE: Do not enable cleartext HTTP/2 (h2c) on port 80. If you set `listen 80 http2`,
    # nginx will speak h2c on that socket and plain HTTP/1.1 clients will see invalid responses
    # (and Cloudflare will typically surface that as a 520).
    #
    # Terminate TLS on 443 with HTTP/2 (ALPN) and proxy to local services.
    #
    # Cloudflare Origin CA cert/key paths (provided by operator):
    #   - /home/nic/cert/agenttools.dev.pem
    #   - /home/nic/cert/agenttools.dev.pri
    server {
        listen 80;
        server_name agenttools.dev www.agenttools.dev api.agenttools.dev;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name api.agenttools.dev;

        ssl_certificate /home/nic/cert/agenttools.dev.pem;
        ssl_certificate_key /home/nic/cert/agenttools.dev.pri;

        location /slice.v1.SliceService/ {
            grpc_pass grpc://core_service;
            grpc_set_header Host $host;
            grpc_set_header X-Real-IP $remote_addr;
        }

        location /admin.v1.AdminService/ {
            grpc_pass grpc://core_service;
            grpc_set_header Host $host;
            grpc_set_header X-Real-IP $remote_addr;
        }

        location ^~ /v1/ {
            proxy_pass http://file_gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    server {
        listen 443 ssl http2;
        server_name agenttools.dev www.agenttools.dev;

        ssl_certificate /home/nic/cert/agenttools.dev.pem;
        ssl_certificate_key /home/nic/cert/agenttools.dev.pri;

        location ^~ /v1/ {
            proxy_pass http://file_gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://web_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
