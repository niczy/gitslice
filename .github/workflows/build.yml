name: Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: web/package-lock.json

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install protoc
      run: |
        sudo apt-get update
        sudo apt-get install -y protobuf-compiler

    - name: Install dependencies
      run: make install

    - name: Generate proto code
      run: make proto

    - name: Build all
      run: make build

    - name: Run core server
      run: |
        timeout 5s ./core_server || true

    - name: Test CLI help
      run: |
        timeout 2s ./bin/gs || true

    - name: Run workflow tests (stub)
      run: |
        cd workflow_test
        go test -v -run TestCLIBuild

    - name: Run full test suite with mocks
      env:
        RUN_INTEGRATION_TESTS: "1"
      run: |
        # benchmark_suite is intentionally excluded from PR CI due to runtime.
        go test $(go list ./... | grep -v '/benchmark_suite$')
        (cd services/admin && go test ./...)
        (cd services/file && go test ./...)
        (cd services/slice && go test ./...)
        (cd servers/core && go test ./...)

    - name: Run Python SDK tests
      run: PYTHONPATH=sdk/python python3 -m unittest discover -s sdk/python/tests

    - name: Run TypeScript SDK tests
      run: |
        npm ci --prefix sdk/typescript
        npm test --prefix sdk/typescript

    - name: Run MCP server tests
      run: |
        npm ci --prefix sdk/mcp
        npm test --prefix sdk/mcp

    - name: Test coverage for workflow tests
      run: |
        cd workflow_test
        go test -cover -coverprofile=coverage.out -run TestCLIBuild
        go tool cover -func=coverage.out

    - name: Run web build
      run: make web-build

  workflow-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gitslice_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gitslice_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'

    - name: Install protoc
      run: |
        sudo apt-get update
        sudo apt-get install -y protobuf-compiler

    - name: Install dependencies
      run: make install

    - name: Generate proto code
      run: make proto

    - name: Run workflow tests against Postgres
      env:
        RUN_INTEGRATION_TESTS: "1"
        TEST_POSTGRES_DSN: "postgres://postgres:postgres@127.0.0.1:5432/gitslice_test?sslmode=disable"
      run: >
        go test -count=1 ./workflow_test
        -run 'Test(RootSliceAndSliceCreateWorkflow|CheckoutReusesCachedBlocks|SliceSyncNoGitUpdatesCurrentCheckout|RootSliceEndToEndWorkflow|FilesystemCLIWorkflowEndToEnd|FilesystemCLIBatchWorkflowEndToEnd|SliceWorkflowCommands|SlicePublishAndChangesetShowWorkflow|ChangesetCreateWorksWithoutGitCheckout|SlicePublishWorksWithoutGitCheckout|SliceDiffAndRestoreWorkWithoutGitCheckout|NoGitCheckoutStartsDirtyTracker|NoGitStatusAndChangesetCreateWorkWithDirtyTracker|NoGitStatusFallsBackWhenDirtyTrackerStops|CheckoutRegistryAndCacheCommands|AgentSessionHTTPFakeCodexChangesetFlow|GatewayHTTPSliceEnvMaterializationIntegration|SliceStateConsistencyVerification)$'

    - name: Run storage Postgres merge tests
      env:
        TEST_POSTGRES_DSN: "postgres://postgres:postgres@127.0.0.1:5432/gitslice_test?sslmode=disable"
      run: >
        go test -count=1 ./internal/storage
        -run TestPostgresAcceptChangesetMergeByIDBasicFileChange

  worker-preview:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: web/package-lock.json

    - name: Install web dependencies
      run: npm ci
      working-directory: web

    - name: Validate Worker preview bundle
      run: npm run preview:worker
      working-directory: web
