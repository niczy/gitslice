name: Build and Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Mount Bazel Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/bazel
            ~/.cache/bazel-disk-cache
          key: bazel-${{ runner.os }}-${{ hashFiles('MODULE.bazel', 'go.mod', 'web/package-lock.json') }}
          restore-keys: |
            bazel-${{ runner.os }}-

      - name: Setup Bazel
        uses: bazelbuild/setup-bazelisk@v3

      - name: Build All
        run: bazel build //...

      - name: Run Tests
        run: bazel test //...

      - name: Upload Test Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: bazel-testlogs/

      - name: Test CLI help
        run: |
          timeout 2s bazel-bin/gs_cli/gs_cli || true

      - name: Run slice service (smoke test)
        run: |
          timeout 5s bazel-bin/slice_service/slice_service_server || true

      - name: Run admin service (smoke test)
        run: |
          timeout 5s bazel-bin/admin_service/admin_service_server || true
