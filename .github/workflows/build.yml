name: Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: web/package-lock.json

    - name: Install Bazelisk
      run: |
        sudo curl -fsSL -o /usr/local/bin/bazel \
          https://github.com/bazelbuild/bazelisk/releases/download/v1.20.0/bazelisk-linux-amd64
        sudo chmod +x /usr/local/bin/bazel

    - name: Bazel build all
      run: bazel build //...

    - name: Copy binaries for smoke tests
      run: make bazel-copy-binaries

    - name: Run slice service
      run: |
        timeout 5s ./slice_service_server || true

    - name: Run admin service
      run: |
        timeout 5s ./admin_service_server || true

    - name: Test CLI help
      run: |
        timeout 2s ./gs_cli/gs_cli || true

    - name: Bazel test (unit tests)
      run: bazel test //... --test_tag_filters=-integration

    - name: Bazel test (integration)
      env:
        RUN_INTEGRATION_TESTS: "1"
      run: bazel test //workflow_test:workflow_test

    - name: Run web build and e2e tests
      run: make web-test-e2e
